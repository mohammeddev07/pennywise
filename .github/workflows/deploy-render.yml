name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to deploy"
        required: false
        default: develop

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Render's own deploy has no build gate - it deploys whatever it pulls. Fail here
      # instead of pushing a build that doesn't compile or a broken test to production.
      - name: Build and test
        run: ./gradlew build

      - name: Trigger Render deploy
        run: curl -sS -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
