spring.application.name=pennywise

environment=${ENV:local}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Web server context path
server.servlet.context-path=/api

# Swagger / OpenAPI
springdoc.swagger-ui.url=${server.servlet.context-path}/openapi/pennywise-v1.yaml

# -----------------------------------------------------------------------------
# Springdoc exposure (disable in prod via env vars)
# -----------------------------------------------------------------------------
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}


# -----------------------------------------------------------------------------
# Schema
# -----------------------------------------------------------------------------
# Ensure Hibernate uses the same default schema
app.db.schema=expense_tracker
spring.jpa.properties.hibernate.default_schema=${app.db.schema}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${app.db.schema}
spring.flyway.default-schema=${app.db.schema}
spring.flyway.create-schemas=true


# -----------------------------------------------------------------------------
# Datasource (defaults for local development)
# -----------------------------------------------------------------------------
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari (reasonable defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.port=8080
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.default-produces-media-type=application/json

# -----------------------------------------------------------------------------
# Security (defaults: OFF locally; ON in non-local)
# -----------------------------------------------------------------------------
# auth-enabled defaults to false when ENV=local, otherwise true (see SecurityConfig below)
app.security.auth-enabled=${APP_SECURITY_AUTH_ENABLED:}
app.security.jwt.issuer-uri=${APP_JWT_ISSUER_URI:}
app.security.jwt.audience=${APP_JWT_AUDIENCE:}
app.security.jwt.issuer=${APP_JWT_ISSUER:pennywise}
app.security.jwt.local-secret=${APP_JWT_LOCAL_SECRET:pennywise-local-development-secret-change-me}
app.security.jwt.access-token-ttl-minutes=${APP_JWT_ACCESS_TOKEN_TTL_MINUTES:60}

app.export.s3.bucket=${APP_EXPORT_BUCKET:}
app.export.s3.presign-ttl-seconds=300

