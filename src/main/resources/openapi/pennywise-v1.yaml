openapi: 3.0.3
info:
  title: PennyWise API
  version: 1.0.0
  description: Personal expense tracking API with multi-book support, idempotent operations, and optimistic concurrency control
servers:
  - url: /api
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Books
  - name: Categories
  - name: Transactions
  - name: Budgets
  - name: Summary
  - name: Export

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "UP" }

  /v1/auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Sign up with email and password
      description: Creates a backend-owned user, stores a BCrypt password hash, and returns a bearer JWT for protected APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/books:
    get:
      tags: [Books]
      summary: List books for current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Books]
      summary: Create book (currency locked)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookCreateRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Books]
      summary: Get book
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Books]
      summary: Update book (name only; currency locked)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookUpdateRequest" }
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/books/{bookId}/categories:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Categories]
      summary: List categories for book
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Categories]
      summary: Add category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreateRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/books/{bookId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/IfMatch"
    patch:
      tags: [Categories]
      summary: Rename/disable category (disable preferred over delete)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateRequest" }
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/books/{bookId}/budgets:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-01"
    get:
      tags: [Budgets]
      summary: List monthly category budgets with spend
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BudgetResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/books/{bookId}/budgets/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/CategoryId"
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-01"
    put:
      tags: [Budgets]
      summary: Create or update a monthly category budget
      parameters:
        - $ref: "#/components/parameters/OptionalIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetUpsertRequest" }
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      tags: [Budgets]
      summary: Remove a monthly category budget
      parameters:
        - $ref: "#/components/parameters/OptionalIfMatch"
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/books/{bookId}/transactions:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - name: from
        in: query
        schema: { type: string, format: date }
      - name: to
        in: query
        schema: { type: string, format: date }
      - name: type
        in: query
        schema: { $ref: "#/components/schemas/TransactionType" }
      - name: categoryId
        in: query
        schema: { type: string, format: uuid }
      - name: q
        in: query
        description: Optional search across title, note, category name, payment method, type, and amount text
        schema: { type: string }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      - name: cursor
        in: query
        schema: { type: string }
    get:
      tags: [Transactions]
      summary: List transactions (cursor pagination)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Transactions]
      summary: Create transaction (idempotent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionCreateRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/books/{bookId}/transactions/{txId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/TxId"
    get:
      tags: [Transactions]
      summary: Get transaction
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Transactions]
      summary: Update transaction (optimistic concurrency)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdateRequest" }
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      tags: [Transactions]
      summary: Soft delete transaction (optimistic concurrency)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/books/{bookId}/balance:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Summary]
      summary: Get balance header
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/books/{bookId}/summary/monthly:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-01"
    get:
      tags: [Summary]
      summary: Monthly summary (income/expense totals + category breakdown)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlySummaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/books/{bookId}/summary/range:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - name: startDate
        in: query
        required: true
        schema: { type: string, format: date }
      - name: endDate
        in: query
        required: true
        schema: { type: string, format: date }
    get:
      tags: [Summary]
      summary: Custom date-range summary (totals, day-by-day, category breakdown)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RangeSummaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/books/{bookId}/exports/csv:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      tags: [Export]
      summary: Create CSV export job (Phase 1 scaffold)
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportCreateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/books/{bookId}/exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [Export]
      summary: Get export job status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/books/{bookId}/exports/{exportId}/download:
    parameters:
      - $ref: "#/components/parameters/BookId"
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [Export]
      summary: Get download URL (Phase 1 placeholder)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: "https://example.com/presigned-url" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TxId:
      name: txId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        example: '"3"'
      description: ETag value from prior GET (optimistic concurrency)
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        example: '"3"'
      description: Optional ETag value for optimistic concurrency when updating an existing resource
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 200
      description: Prevent duplicate inserts on retries. Reusing the same key with the same request replays the stored response; reusing it with a different request returns 409.

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionFailed:
      description: Precondition Failed (ETag mismatch)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "VALIDATION_ERROR" }
            message: { type: string, example: "Invalid request" }
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            requestId: { type: string, example: "01HZX..." }
      required: [error]

    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]

    CategoryType:
      type: string
      enum: [INCOME, EXPENSE]

    PaymentMethod:
      type: string
      enum: [CASH, CARD, BANK_TRANSFER, WALLET, OTHER]

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128 }
        defaultCurrencyCode: { type: string, pattern: "^[A-Za-z]{3}$", example: "USD" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 128 }

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: "Bearer" }
        expiresInSeconds: { type: integer, format: int64, example: 3600 }
        user: { $ref: "#/components/schemas/MeResponse" }

    MeResponse:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, nullable: true }
        defaultCurrencyCode: { type: string, nullable: true, example: "USD" }
        createdAt: { type: string, format: date-time }

    BookCreateRequest:
      type: object
      required: [name, currencyCode, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        currencyCode: { type: string, minLength: 3, maxLength: 3, example: "USD" }
        timezone: { type: string, example: "America/Chicago" }
        openingBalanceMinor: { type: integer, format: int64, example: 0 }

    BookUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }

    BookResponse:
      type: object
      required:
        [id, name, currencyCode, timezone, openingBalanceMinor, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currencyCode: { type: string }
        timezone: { type: string }
        openingBalanceMinor: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }

    CategoryCreateRequest:
      type: object
      required: [type, name]
      properties:
        type: { $ref: "#/components/schemas/CategoryType" }
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { type: string, maxLength: 64, nullable: true, example: "utensils" }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true, example: "#EF4444" }

    CategoryUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        isDisabled: { type: boolean }
        icon: { type: string, maxLength: 64, nullable: true }
        color:
          type: string
          pattern: '^(?:\s*|#[0-9A-Fa-f]{6})$'
          nullable: true
          description: A blank value clears the category color.

    CategoryResponse:
      type: object
      required: [id, bookId, type, name, isDisabled, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CategoryType" }
        name: { type: string }
        isDisabled: { type: boolean }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }

    TransactionCreateRequest:
      type: object
      required: [type, amountMinor, categoryId]
      properties:
        type: { $ref: "#/components/schemas/TransactionType" }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        occurredOn:
          type: string
          format: date
          description: Backwards-compatible date field. Required when occurredAt is omitted.
        occurredAt:
          type: string
          format: date-time
          description: Transaction timestamp. If provided without occurredOn, the book timezone is used to derive occurredOn.
        title: { type: string, maxLength: 120, nullable: true }
        categoryId: { type: string, format: uuid }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        note: { type: string, maxLength: 280, nullable: true }

    TransactionUpdateRequest:
      type: object
      properties:
        type: { $ref: "#/components/schemas/TransactionType" }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        occurredOn: { type: string, format: date }
        occurredAt: { type: string, format: date-time }
        title: { type: string, maxLength: 120, nullable: true }
        categoryId: { type: string, format: uuid }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        note: { type: string, maxLength: 280, nullable: true }

    TransactionCategoryRef:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/CategoryType" }

    TransactionResponse:
      type: object
      required:
        [
          id,
          bookId,
          type,
          amountMinor,
          occurredOn,
          categoryId,
          category,
          createdAt,
          updatedAt,
          version
        ]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/TransactionType" }
        amountMinor: { type: integer, format: int64 }
        occurredOn: { type: string, format: date }
        occurredAt: { type: string, format: date-time, nullable: true }
        title: { type: string, nullable: true }
        categoryId: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/TransactionCategoryRef" }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }

    CursorPage_TransactionResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TransactionResponse" }
        nextCursor:
          type: string
          nullable: true

    TransactionListResponse:
      type: object
      required: [page]
      properties:
        page:
          $ref: "#/components/schemas/CursorPage_TransactionResponse"

    BudgetUpsertRequest:
      type: object
      required: [amountMinor]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 0 }

    BudgetResponse:
      type: object
      required:
        [
          id,
          bookId,
          categoryId,
          categoryName,
          month,
          amountMinor,
          spentMinor,
          remainingMinor,
          currencyCode,
          createdAt,
          updatedAt,
          version
        ]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        month: { type: string, example: "2026-01" }
        amountMinor: { type: integer, format: int64 }
        spentMinor: { type: integer, format: int64 }
        remainingMinor: { type: integer, format: int64 }
        currencyCode: { type: string, example: "USD" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }

    BalanceResponse:
      type: object
      required: [bookId, currencyCode, balanceMinor]
      properties:
        bookId: { type: string, format: uuid }
        currencyCode: { type: string, example: "USD" }
        balanceMinor: { type: integer, format: int64 }

    CategoryBreakdownItem:
      type: object
      required: [categoryId, totalMinor, transactionCount]
      properties:
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/CategoryType" }
        totalMinor: { type: integer, format: int64 }
        budgetMinor: { type: integer, format: int64, nullable: true }
        transactionCount: { type: integer, format: int64 }

    MonthlySummaryResponse:
      type: object
      required: [bookId, month, currencyCode, incomeTotalMinor, expenseTotalMinor, byCategory]
      properties:
        bookId: { type: string, format: uuid }
        month: { type: string, example: "2026-01" }
        currencyCode: { type: string, example: "USD" }
        incomeTotalMinor: { type: integer, format: int64 }
        expenseTotalMinor: { type: integer, format: int64 }
        byCategory:
          type: array
          items: { $ref: "#/components/schemas/CategoryBreakdownItem" }

    DailyBreakdownItem:
      type: object
      required: [date, incomeTotalMinor, expenseTotalMinor]
      properties:
        date: { type: string, format: date }
        incomeTotalMinor: { type: integer, format: int64 }
        expenseTotalMinor: { type: integer, format: int64 }

    RangeSummaryResponse:
      type: object
      required:
        [
          bookId,
          startDate,
          endDate,
          currencyCode,
          incomeTotalMinor,
          expenseTotalMinor,
          transactionCount,
          byCategory,
          byDay
        ]
      properties:
        bookId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        currencyCode: { type: string, example: "USD" }
        incomeTotalMinor: { type: integer, format: int64 }
        expenseTotalMinor: { type: integer, format: int64 }
        transactionCount: { type: integer, format: int64 }
        byCategory:
          type: array
          items: { $ref: "#/components/schemas/CategoryBreakdownItem" }
        byDay:
          type: array
          items: { $ref: "#/components/schemas/DailyBreakdownItem" }

    ExportCreateResponse:
      type: object
      required: [exportId, status]
      properties:
        exportId: { type: string, format: uuid }
        status: { type: string, example: "PENDING" }

    ExportResponse:
      type: object
      required: [id, bookId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        fileName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        errorMessage: { type: string, nullable: true }
