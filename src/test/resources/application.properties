# --- Security ---
app.security.auth-enabled=false
app.security.jwt.issuer-uri=
app.security.jwt.audience=
app.security.jwt.issuer=pennywise-test
app.security.jwt.local-secret=pennywise-test-development-secret-32-bytes
app.security.jwt.access-token-ttl-minutes=60

# --- Schema alignment (matches prod) ---
app.db.schema=expense_tracker
spring.jpa.properties.hibernate.default_schema=${app.db.schema}

# --- Flyway ON for tests (creates schema + pgcrypto + tables) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${app.db.schema}
spring.flyway.default-schema=${app.db.schema}
spring.flyway.create-schemas=true

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# IMPORTANT: do NOT define spring.datasource.url/username/password here.
# Testcontainers (@ServiceConnection) supplies them automatically.
